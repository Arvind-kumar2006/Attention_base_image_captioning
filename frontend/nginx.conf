# Serves the built SPA and proxies the API to the backend container.
#
# Upstream name `api` is resolved by Docker's embedded DNS on the compose
# network; it never leaves the host.

upstream lumina_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded images can be a few MB; the API caps them at 10 MB, so allow a
    # little headroom for the multipart envelope.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy the API. /api and /health are both forwarded; everything else is
    # the SPA, which needs this to be the api base for the client to work.
    location /api/ {
        proxy_pass http://lumina_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Inference can take a while on CPU; do not cut it off mid-caption.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass http://lumina_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed build assets are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached, or a deploy leaves clients on old assets.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: /caption, /history and the rest are all index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API's error envelope is JSON; keep nginx's own errors JSON too rather
    # than serving an HTML page to a fetch() that expects {detail: ...}.
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"detail":"file is larger than the 10 MB limit"}';
    }

    error_page 502 503 504 = @api_down;
    location @api_down {
        default_type application/json;
        return 503 '{"detail":"the API is unavailable"}';
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}