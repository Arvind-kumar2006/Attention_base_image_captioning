[pytest]
testpaths = ml/tests backend/tests
python_files = test_*.py
# The PRD tests are also selectable by marker, which does not suffer the
# hyphen problem that `pytest -k TEST-01` has:
#     pytest -m "prd and test_01"
markers =
    prd: a PRD acceptance test (TEST-01..TEST-05)
    test_01: PRD TEST-01, encoder output shape
    test_02: PRD TEST-02, attention weights sum to 1
    test_03: PRD TEST-03, caption is persisted
    test_04: PRD TEST-04, corrupt upload returns 400
    test_05: PRD TEST-05, caption within the latency target
filterwarnings =
    default
    # Third-party, not ours to fix:
    ignore:.*iscoroutinefunction.*:DeprecationWarning:fastapi.routing
    ignore:.*doesn't match one of the supported versions.*:UserWarning